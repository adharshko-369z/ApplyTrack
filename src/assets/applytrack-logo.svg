<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" rx="100" fill="#FFFFFF"/>

  <!-- Briefcase handle -->
  <path d="M200 160 C200 135, 220 120, 250 120 C280 120, 300 135, 300 160"
        fill="none" stroke="#2E5EAA" stroke-width="12" stroke-linecap="round"/>

  <!-- Briefcase body -->
  <rect x="100" y="150" width="300" height="230" rx="28" fill="#2E5EAA"/>

  <!-- Document rising out -->
  <rect x="170" y="180" width="160" height="170" rx="12" fill="#FFFFFF"/>
  <path d="M290 180 L330 220 H302 C295.373 220, 290 214.627, 290 208 Z" fill="#E3E6EA"/>

  <!-- Document content lines -->
  <rect x="195" y="210" width="75" height="10" rx="5" fill="#94A3B8"/>
  <rect x="195" y="232" width="110" height="8" rx="4" fill="#E3E6EA"/>
  <rect x="195" y="248" width="95" height="8" rx="4" fill="#E3E6EA"/>

  <!-- Checkmark badge -->
  <circle cx="275" cy="285" r="22" fill="#1F9D55"/>
  <path d="M264 285 L272 293 L287 277"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Briefcase front flap -->
  <path d="M100 230 L210 275 C235 285, 265 285, 290 275 L400 230 V352 C400 367.464, 387.464, 380, 372 380 H128 C112.536 380, 100 367.464, 100 352 Z"
        fill="#254C87"/>

  <!-- Pipeline dots: Applied (gray) -> Response (green) -> No Response (amber) -->
  <circle cx="150" cy="337" r="7" fill="#94A3B8"/>
  <line x1="157" y1="337" x2="183" y2="337" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="190" cy="337" r="7" fill="#1F9D55"/>
  <line x1="197" y1="337" x2="223" y2="337" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="230" cy="337" r="7" fill="#D97706"/>
</svg>